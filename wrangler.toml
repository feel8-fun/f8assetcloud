name = "f8assetcloud"
main = "src/index.js"
compatibility_date = "2026-03-31"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[[routes]]
pattern = "assetcloud.feel8.fun"
custom_domain = true

[assets]
directory = "./console_web/dist"
binding = "ASSETS"

[vars]
# Bootstrap admin identity
BOOTSTRAP_ADMIN_NAME = "Feel8"
BOOTSTRAP_ADMIN_EMAIL = "feel8.fun@gmail.com"

# Required: explicit canonical origin for Better Auth, CORS, desktop auth pages,
# and cookie-origin enforcement.
AUTH_BASE_URL = "https://assetcloud.feel8.fun"
AUTH_VERIFY_EMAIL_BASE_URL = "https://assetcloud.feel8.fun/console/verify-email"
AUTH_RESET_PASSWORD_BASE_URL = "https://assetcloud.feel8.fun/console/reset-password"

# Auth email delivery
AUTH_EMAIL_FROM = "Feel8 <no-reply@feel8.fun>"
EMAIL_VERIFY_TOKEN_TTL_SECONDS = "1800"
PASSWORD_RESET_TOKEN_TTL_SECONDS = "1800"

# Public registrations and password-reset requests should be protected with
# Turnstile. Set TURNSTILE_SECRET_KEY with `wrangler secret put`.
TURNSTILE_SITE_KEY = ""

# Comma-separated list of extra origins allowed for CORS in addition to the
# resolved auth base URL. Do not add broad wildcard-style origins here.
# Example: "http://localhost:5173,http://localhost:3000"
CORS_ALLOWED_ORIGINS = ""

[[d1_databases]]
binding = "DB"
database_name = "feel8-assets"
database_id = "53d6ba05-40df-4325-8f3a-e74a9758e5b6"
preview_database_id = "64bb282a-86ed-4bc8-b061-f0f3b7ca95d4"
migrations_dir = "migrations"

# Clean up expired sessions daily at 03:00 UTC
[triggers]
crons = ["0 3 * * *"]
